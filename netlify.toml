# netlify.toml
# Configurazione Netlify per il portfolio artistico

[build]
  publish = "."       # La cartella da pubblicare (root del progetto)
  # command = ""      # Nessun build step: è tutto statico

# Redirect per SPA (non necessario qui, ma utile)
# [[redirects]]
#   from   = "/*"
#   to     = "/index.html"
#   status = 200

# Headers di sicurezza
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=()"

# Cache ottimizzato per asset statici
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
